<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ふたり旅きっぷ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&family=Train+One&display=swap">
<style>
:root {
  /* Layout: one ticket-width column (max 760px). The trip is a ticket; each day runs as a rail line with stations. */
  --ground: #E6EEE9;
  --paper: #F9FCFA;
  --paper-2: #EEF4F0;
  --ink: #15201A;
  --ink-2: #44534C;
  --ink-3: #5B6962;
  --rule: #CAD8D0;
  --grain: rgba(31, 122, 85, .075);
  --line: #1F7A55;
  --m-a: #C43E28;
  --m-b: #2C4E9E;
  --both: #7A3D93;
  --warn: #9A5C00;
  --danger: #B12F28;
  --scrim: rgba(10, 22, 16, .46);
  --shadow: 0 1px 0 rgba(16, 40, 28, .07), 0 14px 30px -20px rgba(16, 40, 28, .45);
  --board-bg: #101512;
  --board-fg: #FFB238;
  --board-dim: #8E7A55;
  --k-see: #1F7A55; --k-eat: #C05A12; --k-play: #AE3577; --k-shop: #8A6A00;
  --k-stay: #3B4EA6; --k-move: #5B6872; --k-other: #7B807D;
  --me: var(--m-a);
  --them: var(--m-b);
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-print: "DotGothic16", "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
  --f-display: "Train One", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0D1411; --paper: #151F1A; --paper-2: #1B2721;
    --ink: #E1EBE5; --ink-2: #AAB9B1; --ink-3: #8C9B93; --rule: #2A3730;
    --grain: rgba(140, 220, 180, .045); --line: #4DB585;
    --m-a: #FF8065; --m-b: #92ACFF; --both: #CD95E6;
    --warn: #E3A43E; --danger: #FF7064;
    --scrim: rgba(0, 0, 0, .62);
    --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 14px 30px -18px rgba(0, 0, 0, .85);
    --k-see: #4DB585; --k-eat: #F28C40; --k-play: #E66DB0; --k-shop: #D6B23C;
    --k-stay: #8E9DFF; --k-move: #9AA7B0; --k-other: #A3A8A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0D1411; --paper: #151F1A; --paper-2: #1B2721;
  --ink: #E1EBE5; --ink-2: #AAB9B1; --ink-3: #8C9B93; --rule: #2A3730;
  --grain: rgba(140, 220, 180, .045); --line: #4DB585;
  --m-a: #FF8065; --m-b: #92ACFF; --both: #CD95E6;
  --warn: #E3A43E; --danger: #FF7064;
  --scrim: rgba(0, 0, 0, .62);
  --shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 14px 30px -18px rgba(0, 0, 0, .85);
  --k-see: #4DB585; --k-eat: #F28C40; --k-play: #E66DB0; --k-shop: #D6B23C;
  --k-stay: #8E9DFF; --k-move: #9AA7B0; --k-other: #A3A8A5;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 45;
  height: env(safe-area-inset-top, 0px); background: var(--ground);
}
body.lock { overflow: hidden; }
body.me-b { --me: var(--m-b); --them: var(--m-a); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--line); text-underline-offset: 3px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
.ic {
  width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.muted { color: var(--ink-3); }
.hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.err { color: var(--danger); font-weight: 700; font-size: 13.5px; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot-msg { padding-block: 48px; text-align: center; color: var(--ink-3); font-family: var(--f-print); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--ground); border-bottom: 1px solid var(--rule);
}
.top-in, .top-sub {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { display: flex; align-items: center; gap: 10px; min-height: 52px; }
.top-sub {
  display: flex; align-items: center; gap: 8px; padding-block: 0 8px;
  font-size: 12.5px; color: var(--ink-2);
}
.top-sub::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none;
}
.brand { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; white-space: nowrap; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.duo { display: flex; margin-right: 4px; }
.av {
  position: relative; display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ground);
  color: var(--paper); font-size: 13px; font-weight: 700; line-height: 1;
}
.duo .av + .av { margin-left: -8px; }
.av-a { background: var(--m-a); }
.av-b { background: var(--m-b); }
.av.me { box-shadow: 0 0 0 2px var(--ink); }
.av.online::after {
  content: ""; position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px;
  border-radius: 50%; background: var(--line); border: 2px solid var(--ground);
}
.icon-b {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  border-radius: 8px; border: 0; background: transparent; color: var(--ink-2);
}
.icon-b:hover { background: var(--paper-2); }
.heart-send { color: var(--them); }
.heart-send .ic { fill: currentColor; }

/* ---------- main column ---------- */
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(150px + env(safe-area-inset-bottom, 0px));
}
.banner {
  margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  background: var(--paper-2); border: 1px dashed var(--rule);
  font-size: 13px; color: var(--ink-2);
}

/* ---------- the ticket ---------- */
.ticket {
  position: relative; margin-top: 12px; overflow: hidden; border-radius: 10px;
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(45deg, var(--grain) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, var(--grain) 0 1px, transparent 1px 7px);
  box-shadow: var(--shadow);
}
.t-main { padding: 14px 18px 16px; display: grid; gap: 4px; }
.t-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.t-kind {
  font-family: var(--f-print); font-size: 13px; letter-spacing: .14em; color: var(--line);
  border: 1px solid currentColor; padding: 1px 8px; border-radius: 3px;
}
.t-acts { display: flex; gap: 6px; }
.t-btn {
  font-size: 12.5px; font-weight: 700; color: var(--ink-2); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; line-height: 1.4;
}
.t-route {
  margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px;
  font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 8.4vw, 44px);
  line-height: 1.15; letter-spacing: .06em; overflow-wrap: anywhere;
}
.t-arr { font-family: var(--f-body); font-size: .55em; color: var(--ink-3); letter-spacing: 0; }
.t-via { font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.t-via span { font-family: var(--f-print); color: var(--ink-3); margin-right: 8px; }
.t-print { margin-top: 4px; font-family: var(--f-print); font-size: 16px; letter-spacing: .04em; }
.t-sub { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.t-stub {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 6px 14px; padding: 12px 18px 14px; border-top: 2px dashed var(--rule);
}
.t-stub::before, .t-stub::after {
  content: ""; position: absolute; top: -11px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--ground);
}
.t-stub::before { left: -10px; }
.t-stub::after { right: -10px; }
.t-cd { display: flex; align-items: baseline; gap: 6px; font-family: var(--f-print); }
.t-cd-l { font-size: 13px; color: var(--ink-2); }
.t-cd-n { font-size: 36px; line-height: 1; }
.t-cd-u { font-size: 15px; }
.t-stub-r { display: grid; justify-items: end; gap: 0; font-family: var(--f-print); font-size: 13px; color: var(--ink-2); }

/* ---------- news + nav ---------- */
.news {
  margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  font-size: 13px; color: var(--ink-2);
}
.news button {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 14px;
  height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 700;
}
.new {
  display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 3px;
  background: var(--them); color: var(--paper); font-family: var(--f-print);
  font-size: 10.5px; line-height: 16px; letter-spacing: .05em; vertical-align: 2px; white-space: nowrap;
}
.nav {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--paper); border-top: 1px solid var(--rule);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-b {
  position: relative; display: grid; justify-items: center; gap: 1px; padding: 7px 2px 5px;
  border: 0; background: none; color: var(--ink-3); font-size: 11px; font-weight: 700; border-radius: 8px;
}
.nav-b .ic { width: 23px; height: 23px; }
.nav-b.on { color: var(--ink); }
.nav-b.on::before {
  content: ""; position: absolute; top: -5px; left: 28%; right: 28%; height: 3px;
  border-radius: 0 0 3px 3px; background: var(--line);
}
.badge {
  position: absolute; top: 2px; left: calc(50% + 7px); min-width: 17px; height: 17px; padding: 0 5px;
  border-radius: 9px; background: var(--danger); color: var(--paper);
  font-size: 10.5px; line-height: 17px; text-align: center;
}
@media (min-width: 860px) {
  .wrap { padding-block: 16px 90px; }
  .nav {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); z-index: 20;
    display: flex; gap: 2px; margin-top: 14px; padding: 4px;
    border: 1px solid var(--rule); border-radius: 10px;
  }
  .nav-b { grid-auto-flow: column; align-items: center; gap: 6px; padding: 8px 14px; font-size: 14px; }
  .nav-b .ic { width: 19px; height: 19px; }
  .nav-b.on { background: var(--paper-2); }
  .nav-b.on::before { top: auto; bottom: -5px; left: 20%; right: 20%; border-radius: 3px 3px 0 0; }
  .badge { position: static; margin-left: 2px; }
}
.fab {
  position: fixed; z-index: 31;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px 0 14px;
  border-radius: 23px; border: 0; background: var(--ink); color: var(--paper);
  font-weight: 700; box-shadow: var(--shadow);
}
@media (min-width: 860px) { .fab { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- shared view pieces ---------- */
.view { margin-top: 14px; }
.vh { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 6px 0 12px; }
.vh h2 { font-size: 21px; }
.vh-act { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.sec { display: flex; align-items: baseline; gap: 8px; font-size: 14px; margin: 18px 0 8px; color: var(--ink-2); letter-spacing: .04em; }
.cnt { font-family: var(--f-print); font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.empty {
  padding: 18px 16px; border: 1.5px dashed var(--rule); border-radius: 10px;
  background: var(--paper); display: grid; gap: 6px; margin-bottom: 6px;
}
.empty-t { font-weight: 700; font-size: 16px; }
.empty-b { color: var(--ink-2); font-size: 13.5px; }
.empty-a { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.kb {
  display: inline-grid; place-items: center; width: 20px; height: 20px; flex: none;
  border: 1.5px solid currentColor; border-radius: 4px; margin-right: 6px;
  font-size: 11.5px; font-weight: 700; line-height: 1; color: var(--ink-2); vertical-align: 1px;
}
.who {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  color: var(--paper); font-size: 10.5px; font-weight: 700; line-height: 1; flex: none;
}
.who-a { background: var(--m-a); }
.who-b { background: var(--m-b); }
.pill {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px;
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.pill-now { background: var(--line); color: var(--paper); }
.pill-next { background: var(--ink); color: var(--paper); }

/* buttons + chips */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14.5px;
  text-decoration: none; white-space: nowrap;
}
.btn .ic { width: 17px; height: 17px; }
.btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--rule); }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.btn.big { height: 50px; width: 100%; font-size: 16px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--paper); }
.btn:disabled { opacity: .45; }
.link-btn { border: 0; background: none; padding: 0; color: var(--line); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.link-danger { border: 0; background: none; padding: 0; color: var(--danger); font-size: 13px; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg, .cats { display: flex; gap: 6px; }
.seg { flex-wrap: wrap; }
.cats { overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.seg button, .cats button {
  display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 12px;
  border-radius: 17px; border: 1px solid var(--rule); background: var(--paper);
  color: var(--ink-2); font-size: 13px; font-weight: 700; white-space: nowrap; flex: none;
}
.seg button[aria-pressed="true"], .cats button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"] .kb, .cats button[aria-pressed="true"] .kb,
.seg button[aria-pressed="true"] .cnt, .cats button[aria-pressed="true"] .cnt { color: var(--paper); }
.seg-s button { height: 30px; padding: 0 10px; font-size: 12.5px; }
.filters { display: grid; gap: 8px; margin-bottom: 4px; }

/* forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 13px; font-weight: 700; color: var(--ink-2); }
input, textarea, select {
  width: 100%; min-height: 44px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px;
}
textarea { resize: vertical; line-height: 1.55; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; padding: 0; accent-color: var(--line); }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--line); outline-offset: 0; border-color: transparent; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.amount { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.danger-zone { border-top: 1px solid var(--rule); padding-top: 14px; display: grid; gap: 10px; font-size: 13.5px; }
.links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13.5px; font-weight: 700; }

/* ---------- itinerary: a rail line per day ---------- */
.day { margin-top: 20px; scroll-margin-top: 120px; }
.day-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.day-n { font-family: var(--f-print); font-size: 21px; letter-spacing: .04em; }
.day-d { font-weight: 700; color: var(--ink-2); }
.day-links { margin-left: auto; display: flex; gap: 14px; font-size: 13px; font-weight: 700; }
.day-empty { color: var(--ink-3); font-size: 13.5px; padding: 12px 0 4px 84px; }
.rail { list-style: none; margin: 6px 0 0; padding: 0; }
.stop, .leg { display: grid; grid-template-columns: 54px 22px minmax(0, 1fr); column-gap: 8px; }
.st-time {
  padding-top: 13px; text-align: right; font-family: var(--f-print); font-size: 15px;
  line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.st-time small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.st-rail, .lg-rail { position: relative; }
.st-rail::before, .lg-rail::before {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--line);
}
.st-rail i {
  position: absolute; left: 50%; top: 13px; width: 18px; height: 18px; margin-left: -9px;
  border-radius: 50%; background: var(--paper); border: 4px solid var(--c, var(--line));
}
.rail > li:first-child .st-rail::before { top: 22px; }
.rail > li:last-child .st-rail::before { bottom: auto; height: 22px; }
.rail > li:only-child .st-rail::before { display: none; }
.stop.next .st-rail i { box-shadow: 0 0 0 5px color-mix(in srgb, var(--line) 28%, transparent); }
.st-card { display: flex; align-items: stretch; margin: 4px 0; background: var(--paper); border-radius: 8px; min-width: 0; }
.stop.past .st-card, .stop.past .st-time { opacity: .55; }
.st-main {
  flex: 1; min-width: 0; display: grid; gap: 2px; padding: 10px 12px;
  background: none; border: 0; text-align: left; border-radius: 8px;
}
.st-title { display: flex; align-items: center; flex-wrap: wrap; font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.st-place { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.st-note { font-size: 13px; color: var(--ink-3); white-space: pre-wrap; overflow-wrap: anywhere; }
.st-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.st-cost { font-variant-numeric: tabular-nums; }
.st-map { display: grid; place-items: center; width: 44px; flex: none; color: var(--ink-3); border-left: 1px solid var(--rule); }
.leg .lg-body {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 16px;
  padding: 2px 0; font-size: 12.5px; color: var(--ink-3);
}
.lg-note { display: inline-flex; align-items: center; gap: 4px; }
.lg-note .ic { width: 15px; height: 15px; }
.leg.warn .lg-note { color: var(--danger); font-weight: 700; }
.leg.soft .lg-note { color: var(--warn); font-weight: 700; }
.lg-route { font-weight: 700; }
.add-line {
  display: flex; align-items: center; gap: 6px; margin: 6px 0 0 84px; width: calc(100% - 84px);
  height: 40px; padding: 0 12px; border: 1.5px dashed var(--rule); border-radius: 8px;

/* ---------- local fallback store: same calls as the shared db, kept in this browser ---------- */
function makeLocalDb() {
  const KEY = "ftk:localdb";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { data = {}; }
  const listeners = new Set();
  const clone = v => JSON.parse(JSON.stringify(v));
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const notify = () => setTimeout(() => listeners.forEach(f => f()), 0);
  const meta = { fromCache: false, hasPendingWrites: false };
  const snap = path => { const body = data[path]; return { id: path.split("/").pop(), exists: !!body, data: () => (body ? clone(body) : undefined), metadata: meta }; };
  const merge = (a, b) => {
    const out = Object.assign({}, a);
    Object.keys(b).forEach(k => {
      const v = b[k], o = out[k];
      out[k] = v && typeof v === "object" && !Array.isArray(v) && o && typeof o === "object" && !Array.isArray(o) ? merge(o, v) : v;
    });
    return out;
  };
  const watch = fn => { listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); };
  function doc(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snap(path),
      set: async body => { data[path] = clone(body); persist(); notify(); },
      update: async body => {
        if (!data[path]) throw { code: "invalid_argument", message: "missing document" };
        data[path] = merge(data[path], clone(body)); persist(); notify();
      },
      delete: async () => { delete data[path]; persist(); notify(); },
      onSnapshot: next => watch(() => next(snap(path))),
      collection: sub => collection(path + "/" + sub),
    };
  }
  function collection(path) {
    const depth = path.split("/").length + 1;
    const query = () => {
      const docs = Object.keys(data).filter(k => k.indexOf(path + "/") === 0 && k.split("/").length === depth).sort().map(snap);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta };
    };
    return {
      path,
      doc: id => doc(path + "/" + (id || newId())),
      add: async body => { const r = doc(path + "/" + newId()); await r.set(body); return r; },
      get: async () => query(),
      onSnapshot: next => watch(() => next(query())),
    };
  }
  window.addEventListener("storage", e => {
    if (e.key !== KEY) return;
    try { data = JSON.parse(e.newValue || "{}") || {}; } catch (err) { data = {}; }
    notify();
  });
  return { doc, collection };
}

let rootUnsubs = [], tripUnsubs = [], retries = 0, settleTimer = 0, slowTimer = 0;
function subscribeRoot() {
  rootUnsubs.forEach(u => u());
  rootUnsubs = [];
  S.loadErr = "";
  let heardMembers = false, heardTrips = false;
  clearTimeout(settleTimer);
  clearTimeout(slowTimer);
  // An empty cached answer is held back briefly in case the server's real answer follows; after that, trust it.
  settleTimer = setTimeout(() => {
    let ch = false;
    if (S.members === undefined && heardMembers) { S.members = null; ch = true; }
    if (S.trips === undefined && heardTrips) { S.trips = []; ch = true; pickTrip(); }
    if (ch) changed();
  }, 4000);
  slowTimer = setTimeout(() => {
    if (S.members === undefined || S.trips === undefined) { S.loadErr = "slow"; changed(); }
  }, 15000);
  rootUnsubs.push(DB.doc("app/members").onSnapshot(snap => {
    heardMembers = true;
    // A first cached snapshot can say "missing" before the server answers; wait for the real one.
    if (!snap.exists && snap.metadata && snap.metadata.fromCache && S.members === undefined) return;
    S.members = snap.exists ? snap.data() : null;
    if (S.loadErr === "slow" && S.trips !== undefined) S.loadErr = "";
    changed();
  }, e => subErr(e, subscribeRoot)));
  rootUnsubs.push(DB.collection("trips").onSnapshot(q => {
    heardTrips = true;
    if (q.empty && q.metadata && q.metadata.fromCache && S.trips === undefined) return;
    S.trips = q.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    if (S.loadErr === "slow" && S.members !== undefined) S.loadErr = "";
    pickTrip();
    changed();
  }, e => subErr(e, subscribeRoot)));
}
function subErr(e, again) {

  S.loadErr = c === "revoked" ? "revoked" : "error";
  changed();
}

  if (S.tripId && ts.some(t => t.id === S.tripId)) return;
  if (!ts.length) { if (S.tripId) selectTrip(null); return; }
  const saved = LS.get("trip", null);
  if (saved && ts.some(t => t.id === saved)) return selectTrip(saved);
  const today = todayISO();
  const upcoming = ts.filter(t => (t.end || t.start || "") >= today).sort((a, b) => (a.start || "").localeCompare(b.start || ""));
  selectTrip((upcoming[0] || ts.slice().sort((a, b) => (b.start || "").localeCompare(a.start || ""))[0]).id);

/* ---------- writes: one at a time per document ---------- */
const writeQueue = new Map();
function enqueue(path, fn) {
  const prev = writeQueue.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  writeQueue.set(path, p);
  p.catch(() => {}).then(() => { if (writeQueue.get(path) === p) writeQueue.delete(path); });
  return p;
}
async function wr(kind, path, body) {
  if (S.readOnly) { toast("閲覧のみのため変更できません"); return false; }
  const op = () => { const r = DB.doc(path); return kind === "set" ? r.set(body) : kind === "update" ? r.update(body) : r.delete(); };
  try { await enqueue(path, op); return true; } catch (e) {
    let err = e;
    if (e && e.code === "unavailable") {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
      try { await enqueue(path, op); return true; } catch (e2) { err = e2; }
    }
    writeErr(err, kind);
    return false;
  }
}
async function writeMany(list) {
  let ok = 0;
  for (let i = 0; i < list.length; i += 6) {
    const r = await Promise.all(list.slice(i, i + 6).map(([path, body]) => wr("set", path, body)));
    ok += r.filter(Boolean).length;
  }
  return ok;
}
function writeErr(e, kind) {
  const c = e && e.code;
  if (c === "invalid_argument" || c === "transform_error") {
    if (kind === "update") toast("見つかりませんでした。相手が削除したのかもしれません");
    else if (S.canWrite !== true) { S.readOnly = true; changed(); toast("このアカウントでは編集できないようです（閲覧のみ）"); }
    else toast("保存できませんでした。入力内容を確認してください");
  } else if (c === "quota_exceeded") toast("保存できる量の上限です。使わない旅を削除してください");
  else if (c === "resource_exhausted") toast("操作が続きすぎました。少し待ってからもう一度どうぞ");
  else if (c === "revoked") toast("アクセス権が変わりました。開き直してください");
  else toast("保存できませんでした。通信状況を確認してください");
}

function useNow(ms) {
  const [t, setT] = useState(Date.now());
  useEffect(() => { const h = setInterval(() => setT(Date.now()), ms || 60000); return () => clearInterval(h); }, []);
  return t;
}
function countdown(trip) {
  const days = tripDays(trip);
  if (!days.length) return null;
  const today = todayISO();
  const until = diffDays(today, trip.start);
  if (until > 0) return { label: "出発まで あと", num: until, unit: "日" };
  const idx = days.indexOf(today);
  if (idx >= 0) return { label: "旅行中", num: idx + 1, unit: "日目" };
  return { label: "帰ってから", num: diffDays(days[days.length - 1], today), unit: "日" };
}

function validateTrip(f) {
  const dest = clip(f.dest, 40);
  if (!dest) return { err: "行き先を入れてください" };
  const start = f.start, end = f.end || f.start;
  if (!parseD(start)) return { err: "出発日を入れてください" };
  if (!parseD(end) || end < start) return { err: "帰る日は、出発日と同じか後の日にしてください" };
  if (diffDays(start, end) > 30) return { err: "旅の長さは31日以内にしてください" };
  const budget = String(f.budget || "").trim() === "" ? null : toNum(f.budget);
  if (String(f.budget || "").trim() !== "" && budget == null) return { err: "予算は数字で入れてください" };
  return { data: { dest, from: clip(f.from, 40), title: clip(f.title, 40) || `${dest}旅行`, start, end, budget, memo: clip(f.memo, 600) } };
}
function tripSetter(setF) {
  return k => e => {
    const v = e.target.value;
    setF(p => {
      const n = Object.assign({}, p, { [k]: v });
      if (k === "start" && v && (!n.end || n.end < v)) n.end = v;
      return n;
    });
  };
}

function Day({ date, n, items, today, nowMin }) {
  const stops = items.map(placeOf).filter(Boolean);
  let nextId = null;
  if (today) {
    const nx = items.find(it => tmin(it.time) != null && tmin(it.time) >= nowMin);
    nextId = nx ? nx.id : null;
  }
  const rows = [];
  items.forEach((it, i) => {
    if (i > 0) rows.push(html`<${Leg} key=${"leg-" + it.id} a=${items[i - 1]} b=${it} />`);
    const t = tmin(it.end) != null ? tmin(it.end) : tmin(it.time);
    rows.push(html`<${Stop} key=${it.id} it=${it} past=${today && t != null && t < nowMin && it.id !== nextId} next=${it.id === nextId} nowMin=${nowMin} />`);
  });
  return html`<section class=${"day" + (today ? " is-today" : "")} id=${date ? "d-" + date : "d-undated"}>
    <header class="day-h">
      <span class="day-n">${date ? n + "日目" : "日付未定"}</span>
      ${date ? html`<span class="day-d">${mdw(date)}</span>` : null}
      ${today ? html`<span class="pill pill-now">きょう</span>` : null}
      <span class="day-links">
        ${stops.length >= 2 ? html`<a href=${gmapRoute(stops)} target="_blank" rel="noopener">この日のルート</a>` : null}
      </span>
    </header>
    ${rows.length ? html`<ol class="rail">${rows}</ol>` : html`<p class="day-empty">${date ? "この日はまだ白紙です" : "日付を決めていない予定はここに入ります"}</p>`}
    ${!S.readOnly ? html`<button class="add-line" type="button" onClick=${() => openSheet("plan", { date })}><${Icon} n="plus" />${date ? "この日に予定を追加" : "予定を追加"}</button>` : null}
  </section>`;
}

function Leg({ a, b }) {
  const ae = tmin(a.end), as = tmin(a.time), bs = tmin(b.time);
  const pa = placeOf(a), pb = placeOf(b);
  let note = "", tone = "";
  if (bs != null && ae != null) {
    if (bs < ae) { note = "時間が重なっています"; tone = "warn"; }
    else {
      const g = bs - ae;
      note = g === 0 ? "すぐ次へ" : "あいだ " + dur(g);
      if (g < 15 && pa && pb && pa !== pb) { note += "・移動が間に合うか確認を"; tone = "soft"; }
    }
  } else if (bs != null && as != null && bs === as) { note = "同じ時刻に予定があります"; tone = "warn"; }
  const route = pa && pb && pa !== pb;
  return html`<li class=${"leg" + (tone ? " " + tone : "")}>
    <span></span><span class="lg-rail"></span>
    <span class="lg-body">

/* ---------- money ---------- */
function settle(arr) {
  const paid = { a: 0, b: 0 }, share = { a: 0, b: 0 };
  let total = 0;
  arr.forEach(e => {
    const v = Math.max(0, +e.amount || 0);
    total += v;
    paid[e.paidBy === "b" ? "b" : "a"] += v;
    if (e.split === "a" || e.split === "b") share[e.split] += v;
    else { share.a += v / 2; share.b += v / 2; }
  });
  const net = paid.a - share.a;
  return { total, paid, share, amt: Math.round(Math.abs(net)), from: net > 0 ? "b" : "a", to: net > 0 ? "a" : "b" };
}
const splitLabel = s => (s === "a" || s === "b" ? nm(s) + "の分" : "ふたりで半分");

}

/* ---------- booklet ---------- */
function buildText(trip) {
  const L = [];
  const days = tripDays(trip);
  const plan = sortPlan(S.plan);
  const line = p => `${p.time ? p.time + (p.end ? "〜" + p.end : "") : "時刻未定"}　${p.title}${p.place && p.place !== p.title ? "（" + p.place + "）" : ""}${p.note ? " ※" + p.note : ""}`;
  L.push(`【${trip.title}】`);
  L.push(`${trip.from ? trip.from + " → " : ""}${trip.dest}`);
  if (trip.start) L.push(`${mdw(trip.start)}〜${mdw(trip.end || trip.start)}（${nightsDays(trip)}）`);
  L.push(`${nm("a")} と ${nm("b")}`);
  if (trip.memo) { L.push(""); L.push("■ メモ"); L.push(trip.memo); }
  days.forEach((d, i) => {
    const its = plan.filter(p => p.date === d);
    L.push(""); L.push(`■ ${i + 1}日目 ${mdw(d)}`);
    if (!its.length) L.push("（予定なし）");
    its.forEach(p => L.push(line(p)));
  });
  const und = plan.filter(p => days.indexOf(p.date) < 0);
  if (und.length) { L.push(""); L.push("■ 日付未定"); und.forEach(p => L.push(line(p))); }
  const both = S.spots.filter(isBoth);
  if (both.length) { L.push(""); L.push("■ ふたりとも行きたい"); both.forEach(s => L.push("・" + s.name + (s.area ? "（" + s.area + "）" : ""))); }
  const todos = S.checks.filter(c => c.type === "todo" && !checkDone(c));
  if (todos.length) { L.push(""); L.push("■ まだのやること"); todos.forEach(c => L.push(`・${c.text}（${ownerLabel(c)}${c.due ? "・" + mdw(c.due) + "まで" : ""}）`)); }
  const packs = S.checks.filter(c => c.type !== "todo");
  if (packs.length) { L.push(""); L.push("■ 持ち物"); packs.forEach(c => L.push(`${checkDone(c) ? "☑" : "☐"} ${c.text}（${ownerLabel(c)}）`)); }
  if (S.money.length || trip.budget) {
    const st = settle(S.money);
    L.push(""); L.push("■ お金");
    L.push(`つかった合計 ${yen(st.total)}${trip.budget ? `／予算 ${yen(trip.budget)}` : ""}`);
    if (st.amt >= 1) L.push(`精算: ${nm(st.from)} → ${nm(st.to)} ${yen(st.amt)}`);
  }
  return L.join("\n");
}

function Sheet({ title, onClose, children, wide }) {
  const ref = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const prev = document.activeElement;
    document.body.classList.add("lock");
    if (ref.current) try { ref.current.focus({ preventScroll: true }); } catch (e) {}
    const onKey = e => { if (e.key === "Escape" && closeRef.current) closeRef.current(); };
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.classList.remove("lock");
      if (prev && prev.focus && document.contains(prev)) try { prev.focus({ preventScroll: true }); } catch (e) {}
    };
  }, []);
  return html`<div class="sheet-bg" onClick=${e => { if (e.target === e.currentTarget && onClose) onClose(); }}>
    <div class=${"sheet" + (wide ? " wide" : "")} role="dialog" aria-modal="true" aria-label=${title} tabindex="-1" ref=${ref}>
      <div class="sheet-h"><h2>${title}</h2>
        ${onClose ? html`<button class="icon-b" type="button" aria-label="閉じる" onClick=${onClose}><${Icon} n="close" /></button>` : null}</div>
      <div class="sheet-b">${children}</div>
    </div>
  </div>`;
}

function RouletteSheet() {
  const anyBoth = S.spots.some(isBoth);
  const anyLiked = S.spots.some(s => s.likes && (s.likes.a || s.likes.b));
  const [pool, setPool] = useState(anyBoth ? "both" : anyLiked ? "liked" : "all");
  const [c, setC] = useState("all");
  const [shown, setShown] = useState(null);
  const [done, setDone] = useState(false);
  const timer = useRef(0);
  useEffect(() => () => clearTimeout(timer.current), []);
  const cand = S.spots.filter(s => (pool === "both" ? isBoth(s) : pool === "liked" ? s.likes && (s.likes.a || s.likes.b) : true))
    .filter(s => c === "all" || (s.cat || "other") === c);
  function spin() {
    if (!cand.length) return;
    clearTimeout(timer.current);
    const pick = cand[Math.floor(Math.random() * cand.length)];
    setDone(false);
    if (reduceMotion() || cand.length === 1) { setShown(pick); setDone(true); return; }
    let i = 0, delay = 55;
    const tick = () => {
      i++;
      if (i >= 16) { setShown(pick); setDone(true); return; }
      setShown(cand[Math.floor(Math.random() * cand.length)]);
      delay *= 1.16;
      timer.current = setTimeout(tick, delay);
    };
    tick();
  }
  return html`<${Sheet} title="迷ったらルーレット" onClose=${closeSheet}>
    <${Seg} value=${pool} onChange=${v => { setPool(v); setDone(false); setShown(null); }} label="どこから選ぶ"
      options=${[["both", "ふたりとも ♡"], ["liked", "♡ があるもの"], ["all", "候補ぜんぶ"]]} />
    <div class="cats" role="group" aria-label="種類">
      <button type="button" aria-pressed=${String(c === "all")} onClick=${() => setC("all")}>全部</button>
      ${SPOT_CATS.map(x => html`<button type="button" key=${x.key} aria-pressed=${String(c === x.key)} onClick=${() => setC(x.key)}><span class="kb">${x.kanji}</span>${x.label}</button>`)}
    </div>
    <div class="board" aria-live="polite">
      ${shown ? html`<small>${done ? "きまり！" : "えらんでいます"}</small><span>${shown.name}</span>`
        : html`<small>${cand.length}件から選びます</small><span>${cand.length ? "？" : "候補がありません"}</span>`}
    </div>
    <div class="row">
      <button class="btn" type="button" disabled=${!cand.length} onClick=${spin}>${done ? "もう一回" : "回す"}</button>
      ${done && shown && !S.readOnly ? html`<button class="btn ghost" type="button" onClick=${() => openSheet("plan", { spot: shown.id })}>旅程に入れる</button>` : null}
    </div>
  <//>`;
}

function tripContext(trip) {
  const L = [];
  const days = tripDays(trip);
  L.push(`行き先: ${trip.dest}`);
  if (trip.from) L.push(`出発地: ${trip.from}`);
  if (days.length) L.push(`日程: ${mdw(days[0])}〜${mdw(days[days.length - 1])}（${nightsDays(trip)}。${days.map((d, i) => `${i + 1}日目=${d}`).join("、")}）`);
  L.push(`旅行者: ${nm("a")}と${nm("b")}の恋人どうし2人`);
  if (trip.budget) L.push(`予算: ふたりで${yen(trip.budget)}`);
  if (trip.memo) L.push(`メモ: ${clip(trip.memo, 300)}`);
  const sp = S.spots.slice(0, 40);
  if (sp.length) L.push("行きたい場所の候補:\n" + sp.map(s => `- ${s.name}${s.area ? `（${s.area}）` : ""} [${cat(s.cat).label}] ${isBoth(s) ? "ふたりとも行きたい" : s.likes && (s.likes.a || s.likes.b) ? "片方が行きたい" : "まだ♡なし"}`).join("\n"));
  const pl = sortPlan(S.plan).slice(0, 60);
  if (pl.length) L.push("決まっている予定:\n" + pl.map(p => `- ${p.date || "日付未定"} ${p.time || "時刻未定"}${p.end ? "〜" + p.end : ""} ${p.title}${p.place && p.place !== p.title ? `（${p.place}）` : ""}`).join("\n"));
  return L.join("\n");
}

    ctl.current = c;
    try { await fn(c.signal); } catch (e) {
      const m = aiErrMsg(e);
      if (m) setErr(m);
      if (e && e.code === "refused") setText("");
      else if (e && typeof e.text === "string" && e.text && (mode === "review" || mode === "chat")) setText(e.text);
    } finally {
      if (ctl.current === c) ctl.current = null;
      setBusy(false);
    }
  }
  const selectAll = arr => setSel(Object.fromEntries(arr.map((_, i) => [i, true])));
  const askSpots = e => { e.preventDefault(); run(async signal => {
    const arr = normSpots(await S.ai.json(promptSpots(trip, clip(hint, 120)), { signal, cache: false }));
    if (!arr.length) throw { code: "empty" };
    setRes(arr); selectAll(arr);
  }); };
  const askPlan = e => { e.preventDefault(); run(async signal => {
    const arr = sortPlan(normPlan(await S.ai.json(promptPlan(trip, pace, pool, clip(hint, 200)), { signal, cache: false }), days));
    if (!arr.length) throw { code: "empty" };
    setRes(arr); selectAll(arr);
  }); };
  const askPack = () => run(async signal => {
    const arr = normPack(await S.ai.json(promptPack(trip), { signal, cache: false }));
    if (!arr.length) throw { code: "empty" };
    setRes(arr); selectAll(arr);
  });
  const askReview = () => run(async signal => {
    setText("");
    const r = await S.ai(promptReview(trip), { signal, cache: false, onText: u => setText(tidy(u.text)) });
    setText(tidy(r.text));
  });
  function sendChat(e) {
    e.preventDefault();
    const m = clip(msg, 600);
    if (!m || busy) return;
    const next = chat.concat({ role: "user", content: m });
    setChat(next); setMsg("");
    run(async signal => {
      setText("");
      const r = await S.ai([{ role: "user", content: chatRules(trip) }].concat(next.slice(-12)), { signal, cache: false, onText: u => setText(tidy(u.text)) });
      setChat(next.concat({ role: "assistant", content: tidy(r.text) }));
      setText("");
    });
  }
  async function addPicked() {
    const k = meKey();
    const items = (res || []).filter((_, i) => sel[i]);
    if (!items.length) return;
    let n = 0;
    const list = items.map(x => {
      if (mode === "spots") return [tp(S.tripId, "spots", newId()), { name: x.name, cat: x.cat, area: x.area, note: x.note, url: "", ai: true, by: k, likes: { a: false, b: false }, likedAt: {}, createdAt: Date.now() + n++ }];
      if (mode === "plan") {
        const sp = S.spots.find(s => s.name === x.spot || s.name === x.title);
        return [tp(S.tripId, "plan", newId()), { title: x.title, kind: x.kind, date: x.date, time: x.time, end: x.end, place: x.place, cost: null, note: x.note, spotId: sp ? sp.id : "", by: k, createdAt: Date.now() + n++ }];
      }
      return [tp(S.tripId, "checks", newId()), { text: x.text, type: "pack", owner: x.owner, group: x.group, due: "", checked: false, checkedBy: { a: false, b: false }, by: k, createdAt: Date.now() + n++ }];
    });
    setBusy(true);
    const ok = await writeMany(list);
    setBusy(false);
    closeSheet();
    if (ok) { toast(`${ok}件を追加しました`); setTab(mode === "spots" ? "spots" : mode === "plan" ? "plan" : "prep"); }
  }
  const titles = { menu: "AIに相談", spots: "おすすめの場所", plan: "旅程のたたき台", review: "旅程をチェック", pack: "持ち物リスト", chat: "自由に相談" };
  const dayLabel = d => (days.indexOf(d) >= 0 ? `${days.indexOf(d) + 1}日目 ${mdw(d)}` : "日付未定");
  let body = null;
  if (mode === "menu") {
    body = html`<div class="ai-menu">${AI_MENU.map(([m, t, d]) => html`<button key=${m} type="button" class="ai-item" onClick=${() => go(m)}><b>${t}</b><span>${d}</span></button>`)}</div>
      <p class="hint">AIの提案は目安です。営業時間・料金・予約状況は公式の情報で確かめてください。使うと、使った人の Claude の利用枠を消費します。</p>`;
  } else if ((mode === "spots" || mode === "plan" || mode === "pack") && res) {
    const render = mode === "spots" ? x => html`<b>${x.name}</b><small>${cat(x.cat).label}${x.area ? "・" + x.area : ""}</small>${x.note ? html`<span>${x.note}</span>` : null}`
      : mode === "plan" ? x => html`<b>${x.time || "--:--"}${x.end ? "〜" + x.end : ""}　${x.title}</b><small>${cat(x.kind).label}${x.place && x.place !== x.title ? "・" + x.place : ""}${x.note ? "・" + x.note : ""}</small>`
      : x => html`<b>${x.text}</b><small>${x.owner === "share" ? "どちらか" : "各自"}・${x.group}</small>`;
    const groups = mode === "plan" ? days.concat("").map(d => ({ d, idx: res.map((x, i) => (x.date === d ? i : -1)).filter(i => i >= 0) })).filter(g => g.idx.length) : null;
    body = html`
      ${groups ? groups.map(g => html`<div key=${g.d || "none"}><p class="pick-day">${dayLabel(g.d)}</p>
          <ul class="pick">${g.idx.map(i => html`<li key=${i}><label class="pick-row"><input type="checkbox" checked=${!!sel[i]} onChange=${e => { const v = e.target.checked; setSel(p => Object.assign({}, p, { [i]: v })); }} /><span class="pick-c">${render(res[i])}</span></label></li>`)}</ul></div>`)
        : html`<${PickList} items=${res} sel=${sel} setSel=${setSel} render=${render} />`}
      <div class="row">
        <button class="btn" type="button" disabled=${busy || !countSel(sel)} onClick=${addPicked}>選んだ${countSel(sel)}件を${mode === "spots" ? "「行きたい」" : mode === "plan" ? "旅程" : "持ち物"}に追加</button>
        <button class="btn ghost" type="button" disabled=${busy} onClick=${() => { setRes(null); setSel({}); }}>やりなおす</button>
      </div>
      ${mode === "plan" ? html`<p class="hint">いまの旅程は消えずに、選んだ予定が追加されます。</p>` : null}`;
  } else if (mode === "spots") {
    body = html`<form class="form" onSubmit=${askSpots}>
      <${Field} id="ai-hint" label="ふたりの好み・希望（任意）"><input id="ai-hint" value=${hint} onInput=${e => setHint(e.target.value)} maxlength="120" placeholder="例: 甘いもの、写真映え、雨でも楽しめる" autocomplete="off" /><//>
      <button class="btn" type="submit" disabled=${busy}>提案してもらう</button></form>`;
  } else if (mode === "plan") {
    body = html`<form class="form" onSubmit=${askPlan}>
      <div class="field"><span class="flabel">どこを入れる？</span><${Seg} value=${pool} onChange=${setPool} label="どこを入れる" options=${[["both", "ふたりとも ♡ を優先"], ["liked", "♡ があるもの"], ["any", "おまかせ"]]} /></div>
      <div class="field"><span class="flabel">ペース</span><${Seg} value=${pace} onChange=${setPace} label="ペース" options=${[["ゆったり", "ゆったり"], ["ふつう", "ふつう"], ["ぎっしり", "ぎっしり"]]} /></div>
      <${Field} id="ai-req" label="ほかの希望（任意）"><input id="ai-req" value=${hint} onInput=${e => setHint(e.target.value)} maxlength="200" placeholder="例: 1日目は14時ごろ到着、夜はゆっくりしたい" autocomplete="off" /><//>
      <button class="btn" type="submit" disabled=${busy || !days.length}>たたき台をつくる</button>
      ${!days.length ? html`<p class="hint">先に旅の日にちを決めてください。</p>` : null}</form>`;
  } else if (mode === "pack") {
    body = html`<p>${trip.dest}・${nightsDays(trip)}・${monthOf(trip)}月ごろに合わせて提案します。いまのリストにあるものは除きます。</p>
      <div class="row"><button class="btn" type="button" disabled=${busy} onClick=${askPack}>持ち物リストをつくる</button></div>`;
  } else if (mode === "review") {
    body = html`<p>旅程（${S.plan.length}件の予定）を見て、気をつけたほうがよい点を教えてもらいます。</p>
      ${text ? html`<div class="ai-out" aria-live="polite">${text}</div>` : null}
      <div class="row"><button class="btn" type="button" disabled=${busy || !S.plan.length} onClick=${askReview}>${text ? "もう一度チェック" : "チェックしてもらう"}</button></div>
      ${!S.plan.length ? html`<p class="hint">先に旅程に予定を入れてください。</p>` : null}`;
  } else if (mode === "chat") {
    body = html`<div class="bubbles" aria-live="polite">
        ${!chat.length && !text ? html`<p class="hint">例: 「雨だったらどこに行く？」「記念日っぽいディナーのお店は？」「2日目の午後が空いたら？」</p>` : null}
        ${chat.map((m, i) => html`<div key=${i} class=${"bub " + (m.role === "user" ? "u" : "a")}>${m.content}</div>`)}
        ${text ? html`<div class="bub a">${text}</div>` : null}
      </div>
      <form class="chat-form" onSubmit=${sendChat}>
        <textarea id="ai-chat" rows="2" value=${msg} onInput=${e => setMsg(e.target.value)} maxlength="600" aria-label="相談する内容" placeholder="ききたいことを書く"
          onKeyDown=${e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendChat(e); }}></textarea>
        <button class="btn" type="submit" disabled=${busy || !msg.trim()}>送る</button>
      </form>`;
  }
  return html`<${Sheet} title=${titles[mode]} onClose=${closeSheet} wide=${true}>
    ${mode !== "menu" ? html`<button class="back" type="button" onClick=${() => go("menu")}>← AIメニューへ</button>` : null}
    ${body}
    ${busy ? html`<div class="ai-busy"><span>${text ? "書いています…" : "考えています…（30秒ほどかかることがあります）"}</span>
      ${ctl.current ? html`<button class="btn ghost small" type="button" onClick=${() => ctl.current && ctl.current.abort()}>止める</button>` : null}</div>` : null}
    ${err ? html`<p class="err" role="alert">${err}</p>` : null}
  <//>`;
}

/* ---------- start ---------- */
root.textContent = "";
render(html`<${App} />`, root);
boot().catch(() => { S.loadErr = "error"; changed(); });
})();
</script>

</body></html>
